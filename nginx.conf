server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + live run streams. proxy_buffering off is REQUIRED for the
    # SSE activity feed — buffered, the events arrive in one lump at the
    # end and the "live" view isn't.
    location /api/ {
        proxy_pass http://api:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /healthz {
        proxy_pass http://api:8091;
    }
}
